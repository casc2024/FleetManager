function supplyCard(i){let k=seed.inventories.findIndex(v=>v.plant===i.plant&&v.sku===i.sku),p=procurement(i),c=supplyChoice(i),r=c.selected,t=r?r.product+r.freight:null,delta=r&&c.automatic?t-(c.automatic.product+c.automatic.freight):0;return `<article class="panel"><div class="panelhead"><div><span class="eyebrow">${esc(i.plant)}</span><h2>${esc(i.sku)} · ${num(p.needed)} t</h2><span class="pill ${c.manual?'warn':''}">${c.manual?'User selection':'System suggestion'}</span> <span class="pill ${r?.approved?'':'warn'}">${r?.approved?'Approved supplier':'Pending approval'}</span></div><div><div class="hint">Suggested purchase · ${num(p.needed/(i.lot||1))} loads</div><div class="number">${t===null?'No rate':money(p.needed*t)}</div></div></div><label class="field">Selected supplier · you can change it<select aria-label="Suggested supplier ${esc(i.plant)} ${esc(i.sku)}" onchange="setSupplyChoice(${k},this.value)">${c.available.map(v=>`<option value="${esc(v.supplier)}" ${v.supplier===r?.supplier?'selected':''}>${esc(v.supplier)} · ${money(v.product+v.freight)}/t${v.supplier===c.automatic?.supplier?' · Lowest total cost':''}</option>`).join('')}</select></label><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-top:16px">${card('Product Price',r?money(r.product):'No rate','USD / ton · product price')}${card('Transportation Cost',r?money(r.freight):'No rate','USD / ton · transportation to plant')}${card('Total Cost per Ton',t===null?'No rate':money(t),'Product Price + Transportation Cost')}</div><div class="note">${c.automatic?`The system suggests <b>${esc(c.automatic.supplier)}</b>: ${money(c.automatic.product+c.automatic.freight)}/t, the lowest Total Cost per Ton among ${c.available.length} rates for the same SKU and plant.`:'Add a rate to calculate a suggestion.'}${c.manual?` Your selection changes the cost by ${money(delta)}/t (${money(delta*p.needed)} on this purchase).`:''}${p.missing?` Incomplete demand: ${p.missing} days pending; provisional quantity.`:''}</div><div class="hint">Product total: ${r?money(p.needed*r.product):'—'} · Transportation total: ${r?money(p.needed*r.freight):'—'} · Origin: ${esc(r?.origin||'Confirm')} · First required delivery: ${p.first||'—'}</div><div class="actions">${c.manual?`<button onclick="setSupplyChoice(${k},'')">Use automatic suggestion</button>`:''}${r?`<button onclick="reviewSupply(${k})">Review rate / approval</button><button class="primary" onclick="buySupply(${k})">Prepare suggested purchase</button>`:`<button onclick="rateFor(${inlineArg(i.plant)},${inlineArg(i.sku)})">Add rate</button>`}</div></article>`}
function renderSupply(){let a=rows().filter(i=>procurement(i).needed>0);$('title').textContent='Suggested purchases · weekly supply';$('content').innerHTML=`<section class="panel"><div class="panelhead"><div><h2>System-suggested purchase</h2><span class="hint">${a.length} SKUs with requirements · next 7 days</span></div><button onclick="change('dashboard')">← Back to overview</button></div><div class="note">The suggestion uses the lowest <b>Total Cost per Ton = Product Price + Transportation Cost</b> for the same material, plant, and unit. You can change the supplier; your choice is saved for this planning date with its history preserved. Pending rates still require commercial and technical validation.</div><button onclick="change('planning')">Complete demand / view plan</button></section><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))">${a.map(supplyCard).join('')}</div>${a.length?'':'<div class="panel empty">No suggested purchases based on recorded demand. Complete demand to calculate supply.</div>'}`}
async function setSupplyChoice(k,supplier){try{let i=supplyIndex(k);await save('supplyChoice',{plant:i.plant,sku:i.sku,date:date(),supplier});toast(supplier?'Supplier changed. Costs recalculated.':'Automatic suggestion restored.')}catch(e){toast(e.message);render()}}
function reviewSupply(k){let i=supplyIndex(k),r=supplyChoice(i).selected;if(r)rateForm(r)}

function skuCoverage(inventory,demand,safety=0){if(demand===null)return {days:null,percent:null,status:'pending',label:'Demand pending',shortfall:null};let shortfall=Math.max(0,demand+safety-inventory),status=shortfall>0?'low':demand===0?'idle':'good';return {days:demand>0?inventory/demand:null,percent:demand>0?100*inventory/demand:null,status,label:status==='low'?'Low stock · action required':status==='idle'?'No demand tomorrow':'Sufficient inventory',shortfall}}

function tomorrowRows(){return rows().map(i=>{let d=plan(i.plant,i.sku,add(date(),1)),inbound=purchaseRows().filter(o=>o.plant===i.plant&&o.sku===i.sku&&!received(o)&&o.arrival===add(date(),1)).reduce((a,o)=>a+o.qty,0),gap=d===null?null:Math.max(0,d+i.safety-i.qty-inbound),qty=gap===null?null:Math.ceil(gap/(i.lot||1))*(i.lot||1),supplier=supplyChoice(i).selected,before=i.qty+inbound+(qty||0);return {i,d,inbound,qty,supplier,coverage:skuCoverage(i.qty,d,i.safety),loads:qty===null?null:qty/(i.lot||1),balance:d===null?null:before-d,capacityRisk:i.capacity!==null&&before>i.capacity,late:qty>0&&i.lead>1}})}
function dispatchPanel(){let a=tomorrowRows(),missing=a.filter(x=>x.d===null).length;return `<section class="panel" style="border:2px solid #75a36a"><div class="panelhead"><div><h2>1. Confirm next-day demand · ${add(date(),1)}</h2><span class="hint">${missing?missing+' materials pending. Complete all fields to generate the dispatch plan.':'Demand complete. Review supply and alerts before dispatching.'}</span></div><button class="primary" onclick="tomorrowForm()">${missing?"Enter tomorrow’s demand":"Edit tomorrow’s demand"}</button></div><div class="note">Confirm tons by material and plant. Enter 0 when no consumption is planned. Inventory covers production first; only the shortfall generates suggested loads. Use the plant filter to plan a specific plant.</div><div class="panelhead"><h2>2. Dispatch planning · ${add(date(),1)}</h2><button ${missing?'disabled':''} onclick="exportDispatch()">↓ Export dispatch plan</button></div>${missing?'<div class="empty">Planning pending: confirm tomorrow’s demand. Blank fields are not treated as zero.</div>':table(['Plant / SKU','Demand (t)','Inventory (t)','SKU coverage','In transit (t)','Additional supply (t)','Suggested loads','Supplier / origin','Product + freight cost','Closing balance / alert'],a.map(x=>`<tr class="coverage-${x.coverage.status}"><td>${esc(x.i.plant)}<small>${esc(x.i.sku)}</small></td><td>${num(x.d)}</td><td>${num(x.i.qty)}</td>${coverageCell(x)}<td>${num(x.inbound)}</td><td>${num(x.qty)}</td><td>${num(x.loads)}<small>Lot: ${num(x.i.lot)} tons/load</small></td><td>${x.qty?esc(x.supplier?.supplier||'Supplier approval required'):'Covered by inventory / inbound'}<small>${x.qty?esc(x.supplier?.origin||'Confirm origin'):''}</small></td><td>${x.qty===0?money(0):x.supplier?money(x.qty*(x.supplier.product+x.supplier.freight)):'Rate pending'}</td><td>${num(x.balance)} t<small>${x.capacityRisk?'⚠ Split deliveries: exceeds capacity':x.late?'⚠ Lead time exceeds one day':x.qty&&!x.supplier?'⚠ Approve rate':'Verify delivery schedule'}</small></td></tr>`).join(''))}<div class="note">Coverage = current inventory ÷ tomorrow’s demand. 100% equals 1 day at that demand rate. <b>Red:</b> stock does not cover demand plus safety stock. <b>Green:</b> stock covers both. Days are equivalents at tomorrow’s demand rate, not a forecast of future days. Inbound and suggested purchases are excluded from current coverage but included in planned supply and closing balances. Zero demand has a neutral status.</div><p class="hint">Loads are estimated using each SKU’s configurable purchase lot. This plan does not automatically record purchases or assign trucks or drivers. Confirm equipment capacity, receiving hours, and supplier availability.</p></section>`}
function tomorrowForm(){let a=rows(),d=add(date(),1);modal('Required demand for dispatch on '+d,`<div class="note" style="grid-column:1/-1">Complete every plant and material in tons. Enter 0 to confirm no demand; blank fields remain pending. Demand changes retain their history.</div>`+a.map((i,k)=>field(esc(i.plant)+' · '+esc(i.sku)+' (t)','tomorrow'+k,'number',plan(i.plant,i.sku,d)??'','required')).join(''),async()=>{let values=a.map((i,k)=>({...i,qty:nval('tomorrow'+k)}));for(let i of values){let body={id:crypto.randomUUID(),type:'plan',data:{plant:i.plant,sku:i.sku,date:d,qty:i.qty,method:'Confirmed demand for next-day dispatch'}};let response=await fetch('/api/materialiq/model/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.status===401)throw Error('Sign in with ChatGPT using the link above to record changes under your user account.');if(!response.ok)throw Error('Saving was not completed. Some materials may have been saved; review the plan before retrying.')}page='planning';await init();$('modal').close();toast('Demand confirmed. Dispatch plan updated.');})}

function planForm(){modal('Schedule demand by material',common(add(date(),1))+select('Mode','mode',['Direct tons','Production CY × tons/CY'])+field('Required tons (or CY)','fq','number',0,'required')+field('Dosage tons/CY · verify','coef','number',0.2585,'required')+field('Repeat for next days (1 to 7)','days','number',1,'required max="7" step="1"')+'<div class="note" style="grid-column:1/-1">Record each SKU separately. Do not add every aggregate from the average mix: they may be alternatives. A confirmed zero indicates a day without production.</div>',async()=>{let days=nval('days');if(days<1||days>7||!Number.isInteger(days))throw Error('Select 1 to 7 days.');let qty=nval('fq')*(val('mode').startsWith('Production')?nval('coef'):1),p=val('fp'),s=val('fs'),d=val('fd');for(let k=0;k<days;k++)await save('plan',{plant:p,sku:s,date:add(d,k),qty,method:val('mode'),coefficient:nval('coef')})});$('fs').onchange=()=>{$('coef').value=seed.coefficients[val('fs')]||0}}
function snapshotForm(p,s){modal('Confirm valued closing balance',common()+field('Physical inventory (tons)','fq','number',0,'required')+field('Total delivered value USD','fv','number','','required')+'<div class="note">Include product and transportation in the opening value. This closing balance replaces previous and same-day movements.</div>',()=>save('snapshot',{plant:val('fp'),sku:val('fs'),date:val('fd'),qty:nval('fq'),value:nval('fv')}));if(p&&s){$('fp').value=p;$('fs').value=s;$('fq').value=ledger(seed.inventories.find(i=>i.plant===p&&i.sku===s)).qty}}
function usageForm(){modal('Record daily actual consumption',common()+field('Consumption (tons)','fq','number',0,'required')+'<div class="note">Record actual consumption once. It updates inventory and forecasting and applies after the confirmed closing date.</div>',()=>{let i=ledger(seed.inventories.find(i=>i.plant===val('fp')&&i.sku===val('fs')),val('fd'));if(val('fd')<=i.start)throw Error('Consumption must be after the last closing date.');if(nval('fq')>i.qty)throw Error('Consumption exceeds the balance. Record receipts first or correct the closing balance.');return save('usage',{plant:val('fp'),sku:val('fs'),date:val('fd'),qty:nval('fq')})})}
function configForm(p,s){let i=ledger(seed.inventories.find(i=>i.plant===p&&i.sku===s));modal('Policy · '+esc(p)+' / '+esc(s),field('Effective date','fd','date',date(),'required')+select('Assigned supplier','supplier',['',...choices(i).map(r=>r.supplier)],i.supplier)+field('Safety stock (tons)','safety','number',i.safety,'required')+field('Maximum capacity (tons)','cap','number',i.capacity??'')+field('Delivery lead time (days)','lead','number',i.lead,'required step="1"')+field('Purchase lot (tons)','lot','number',i.lot,'required'),()=>{if(nval('lot')<=0)throw Error('Lot size must be greater than zero.');if(val('cap')&&nval('cap')<nval('safety'))throw Error('Capacity cannot be lower than safety stock.');return save('config',{plant:p,sku:s,date:val('fd'),supplier:val('supplier'),safety:nval('safety'),capacity:val('cap')?nval('cap'):null,lead:nval('lead'),lot:nval('lot')})})}
function editRate(id){rateForm(rates().find(r=>r.id===id))}
function rateForm(r){modal('Rate with effective date',select('Plant','fp',plants,r?.plant||plant()||plants[0])+select('SKU','fs',skus(),r?.sku||'Cement')+field('Supplier','supplier','text',r?.supplier||'','required')+field('Effective date','fd','date',date(),'required')+field('Product USD / ton','product','number',r?.product||0,'required')+field('Transportation USD / ton','freight','number',r?.freight||0,'required')+select('Technical and commercial approval','approved',['Pending','Approved'],r?.approved?'Approved':'Pending')+'<div class="note">Previous records are retained; the effective date controls future operations. Different SKUs are not combined.</div>',()=>save('rate',{id:crypto.randomUUID(),plant:val('fp'),sku:val('fs'),supplier:val('supplier').trim(),date:val('fd'),product:nval('product'),freight:nval('freight'),unit:'Ton',approved:val('approved')==='Approved',source:'Rate entered in the application'}))}
function purchaseForm(p,s,rid,qty){modal('Record purchase / supply order',common()+select('Supplier / rate','rate',[])+field('Quantity (tons)','fq','number',25,'required')+field('Product USD / ton','product','number',0,'required')+field('Transportation USD / ton','freight','number',0,'required')+select('Status','status',['Received','In transit'])+field('Expected arrival','arrival','date',date(),'required')+field('Invoice / order / ticket','ref','text','','required')+'<div class="note">Prices are stored with this purchase. In-transit orders do not increase inventory until receipt is confirmed. A receipt on or before a confirmed closing date is considered included in that closing balance.</div>',()=>{let route=rates(val('fd')).find(r=>r.id===val('rate'));if(!route)throw Error('Select a valid rate for the purchase date.');if(nval('fq')<=0)throw Error('Quantity must be greater than zero.');if(val('arrival')<val('fd'))throw Error('Arrival cannot be before the purchase date.');return save('purchase',{plant:val('fp'),sku:val('fs'),date:val('fd'),supplier:route.supplier,product:nval('product'),freight:nval('freight'),qty:nval('fq'),arrival:val('arrival'),status:val('status')==='Received'?'received':'ordered',ref:val('ref')})});let refresh=()=>{let a=rates(val('fd')).filter(r=>r.plant===val('fp')&&r.sku===val('fs'));$('rate').innerHTML=a.map(r=>`<option value="${esc(r.id)}">${esc(r.supplier)} · ${money(r.product+r.freight)}/t</option>`).join('');fill()};let fill=()=>{let r=rates(val('fd')).find(r=>r.id===val('rate'));$('product').value=r?.product||0;$('freight').value=r?.freight||0};$('fp').onchange=refresh;$('fs').onchange=refresh;$('fd').onchange=refresh;$('rate').onchange=fill;refresh();if(p&&s){$('fp').value=p;$('fs').value=s;refresh();if(rid){$('rate').value=rid;fill()}if(qty!==undefined)$('fq').value=qty;$('status').value='In transit';$('arrival').value=add(date(),1)}}

function toggleVoided(){document.querySelectorAll('.voided-purchase').forEach(el=>{el.hidden=!$('showVoided').checked})}
function editPurchaseForm(id){let o=purchaseRows().find(o=>o.id===id);if(!o)return;let receipt=events.find(e=>e.type==='receipt'&&e.data.order===id);modal('Edit purchase · '+esc(o.ref),select('Plant','fp',plants,o.plant)+select('Material / SKU','fs',skus(),o.sku)+field('Purchase date','fd','date',o.date,'required')+field('Supplier','supplier','text',o.supplier,'required')+field('Quantity (tons)','fq','number',o.qty,'required')+field('Product Price · USD / t','product','number',o.product,'required')+field('Transportation Cost · USD / t','freight','number',o.freight,'required')+field('Expected arrival','arrival','date',o.arrival||o.date,'required')+field('Invoice / order / ticket','ref','text',o.ref,'required')+field('Reason for correction','reason','text','','required')+`<div class="note" style="grid-column:1/-1">Status: ${received(o)?'Received':'In transit'}. Amounts retain their recorded values until corrected; new rates do not replace them. To correct an incorrect receiving status, void and re-enter the purchase. Confirmed physical closing balances are not changed by this edit.</div>`,()=>{if(nval('fq')<=0)throw Error('Quantity must be greater than zero.');if(val('arrival')<val('fd'))throw Error('Arrival cannot be before the purchase date.');if(receipt&&receipt.data.date<val('fd'))throw Error('Purchase date cannot be after receipt.');if(!val('reason').trim())throw Error('Enter the reason for correction.');let replacement={plant:val('fp'),sku:val('fs'),date:val('fd'),supplier:val('supplier').trim(),qty:nval('fq'),product:nval('product'),freight:nval('freight'),arrival:val('arrival'),ref:val('ref').trim(),status:o.status};return save('purchaseEdit',{order:id,date:date(),reason:val('reason').trim(),replacement,before:{...o}})})}
function voidPurchaseForm(id,voided){let o=purchaseRows(date(),true).find(o=>o.id===id);if(!o)return;modal((voided?'Void':'Restore')+' purchase · '+esc(o.ref),`<div class="note" style="grid-column:1/-1">${esc(o.plant)} · ${esc(o.sku)} · ${num(o.qty)} t · ${money(o.qty*(o.product+o.freight))}. ${voided?'This purchase will be excluded from spending and calculated inventory. The original purchase and receipt records remain in history and can be restored.':'This purchase will be included in calculations using its latest corrected details.'} Review any inventory closing balance that already includes this purchase separately.</div>`+field('Reason','reason','text','','required'),()=>{if(!val('reason').trim())throw Error('Enter a reason.');return save('purchaseVoid',{order:id,date:date(),voided,reason:val('reason').trim()})})}
function receiptForm(id){let o=purchaseRows().find(o=>o.id===id);modal('Confirm full receipt',field('Receipt date','fd','date',date(),'required')+`<div class="note">${num(o.qty)} t · ${esc(o.sku)} · ${esc(o.plant)}. The original order cost is retained. Record separate orders for partial deliveries.</div>`,()=>{if(val('fd')<o.date)throw Error('Receipt cannot be before the purchase date.');return save('receipt',{order:id,date:val('fd')})})}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){download('MaterialIQ-backup-'+date()+'.json',JSON.stringify({seed,events},null,2),'application/json');let head=['date','plant','SKU','supplier','tons','product_USD_per_ton','transportation_USD_per_ton','product_total','transportation_total','total_USD','status','reference'],data=purchaseRows().filter(o=>!plant()||o.plant===plant()).map(o=>[o.date,o.plant,o.sku,o.supplier,o.qty,o.product,o.freight,o.qty*o.product,o.qty*o.freight,o.qty*(o.product+o.freight),received(o)?'Received':'In transit',o.ref]);download('MaterialIQ-purchases-'+date()+'.csv',[head,...data].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');toast('JSON backup and purchase CSV exported')}
$('date').value=today();loadBusinessUser();init();
</script></html>
